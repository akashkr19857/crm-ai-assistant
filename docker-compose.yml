# Written and syntax-checked, NOT run: Docker is not installed on the development laptop.
services:
  ollama:
    image: ollama/ollama:0.12.3
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
  api:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment:
      CRM_OLLAMA_URL: http://ollama:11434
      CRM_CORS_ORIGINS: http://localhost:3300
    volumes: [crm-data:/app/data/runtime]
    ports: ["8300:8300"]
    depends_on: [ollama]
  web:
    build:
      context: ./frontend
      args: {NEXT_PUBLIC_API_URL: "http://localhost:8300"}
    ports: ["3300:3300"]
    depends_on: [api]
volumes:
  ollama: {}
  crm-data: {}
